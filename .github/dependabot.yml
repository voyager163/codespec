version: 2
updates:
  # Tool package (published npm package)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Starter template shipped into generated projects
  - package-ecosystem: npm
    directory: "/templates/starter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # GitHub Actions used by CI + the security gate
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
